name: CI

on:
  push:
  pull_request:

jobs:
  verify-nodb:
    name: make verify-nodb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.6'
          cache: true

      - name: Run verify-nodb
        run: make verify-nodb

      - name: Show coverage total
        run: go tool cover -func=coverage.out | grep '^total:'
